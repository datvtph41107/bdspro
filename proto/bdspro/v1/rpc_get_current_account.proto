syntax = "proto3";

package bdspro.v1;

option go_package = "github.com/datvtph41107/bdspro/pb/bdspro/v1;bdspb";

import "bdspro/v1/user.proto";

// No account_id supplied by caller: JWT plus live Session determine identity.
message GetCurrentAccountRequest {}

message GetCurrentAccountResponse {
  // Retained for wire compatibility with the first approved proto contract.
  int64 account_id = 1;
  // Optional typed projection for future clients, not a second identity.
  User user = 2;
}
