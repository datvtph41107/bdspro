syntax = "proto3";

package bdspro.v1;

option go_package = "github.com/datvtph41107/bdspro/pb/bdspro/v1;bdspb";

import "google/protobuf/timestamp.proto";

// AccountService is the first BDSPro RPC boundary. The caller's Account
// identity comes from a verified session-bound JWT in gRPC metadata, never
// from a client-supplied account_id.
//
// HTTP Gin continues to serve existing REST endpoints. This service will
// delegate to the very same Auth and Organization services when gapi arrives.
service AccountService {
  // Returns the authenticated Account. Requires valid Bearer JWT and live
  // PostgreSQL Session; invalidated JWTs must fail immediately.
  rpc GetCurrentAccount(GetCurrentAccountRequest) returns (GetCurrentAccountResponse);

  // Lists the Workspaces currently available through live PostgreSQL
  // memberships. This response is not a persisted authorization grant.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
}

// GetCurrentAccountRequest has no caller-owned identity fields.
message GetCurrentAccountRequest {}

message GetCurrentAccountResponse {
  int64 account_id = 1;
}

// ListWorkspacesRequest has no organization or account identifier: the
// Session is authoritative for the caller identity.
message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// Workspace is a read projection of a membership, not an independent identity.
message Workspace {
  int64 organization_id = 1;
  string organization_name = 2;
  int64 membership_id = 3;
  google.protobuf.Timestamp joined_at = 4;
}
