name: bdspro

services:
    postgres:
        image: postgres:18-alpine
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=bdspro
        ports:
            - "5432:5432"
        volumes:
            - data-volume:/var/lib/postgresql

    redis:
        image: redis:7-alpine
        # Redis stores scheduled, active and retry tasks for Asynq.
        command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
        ports:
            - "6379:6379"
        volumes:
            - redis-volume:/data
    api:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            - DB_SOURCE=postgresql://root:secret@postgres:5432/bdspro?sslmode=disable
            - REDIS_ADDRESS=redis:6379
            - LOG_FORMAT=json
        depends_on:
            - postgres
            - redis
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh"]
        command: ["/app/main"]

volumes:
    data-volume:
        name: bdspro-postgres18-data
    redis-volume:
        name: bdspro-redis-data
