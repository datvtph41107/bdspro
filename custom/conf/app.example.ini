; Development-only local example. Copy to custom/conf/app.ini; do not commit credentials.
RUN_MODE = development

[server]
HTTP_SERVER_ADDRESS = 127.0.0.1:8080
; Browser OAuth enables cookie login/consent only when set. In production, use HTTPS.
PUBLIC_ORIGIN = http://127.0.0.1:8080
; Only exact ingress reverse-proxy peer IPs/CIDRs. Empty ignores forwarding headers.
; TRUSTED_PROXIES = 192.0.2.10, 198.51.100.0/28

[database]
DB_SOURCE = postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
MIGRATION_URL = file://db/migration

[redis]
ADDR = 127.0.0.1:6379

; Optional cache, initialized only by a feature that consumes it.
; Not used for OIDC state, OTP, session revocation or rate limits.
; [cache]
; ADAPTER = memory
; HOST = 127.0.0.1:11211   ; used only when ADAPTER = memcache
; PREFIX = cache:
; MAX_ENTRIES = 10000
; ITEM_TTL = 5m

; Optional source-IP admission policies, based on DRX IPActive actions.
; Defaults preserve all current BDSPro routes and Redis counters.
; Invalid overrides prevent server startup; changes may affect active counters.
; [ipactive]
; LOGIN_LIMIT = 30
; LOGIN_WINDOW = 1m
; LOGIN_MODE = count
; REGISTER_LIMIT = 10
; REGISTER_WINDOW = 1h
; REGISTER_MODE = count
; DRX-style registration cooldown (opt-in policy migration):
; REGISTER_LIMIT = 1
; REGISTER_WINDOW = 30s
; REGISTER_MODE = cooldown

[log]
MODE = console
FORMAT = console
LEVEL = info
ROOT_PATH = data/log

[log.file]
FILE_NAME = bdspro.log

[security]
TOKEN_SYMMETRIC_KEY = 01234567890123456789012345678901
ACCESS_TOKEN_DURATION = 15m
REFRESH_TOKEN_DURATION = 24h

; Audit storage is independent of session history and JWT signing.
; Production must supply BDS__AUDIT__HMAC_KEY using a separate secret.
[audit]
HMAC_KEY = abcdef0123456789abcdef0123456789
RETENTION_DAYS = 90

[cors]
ALLOWED_ORIGINS = http://localhost:3000

; Trusted OpenID Connect issuer. Configure all keys to enable OAuth2/OIDC.
[oauth2]
ISSUER =
AUTHORIZATION_URL =
TOKEN_URL =
JWKS_URL =
CLIENT_ID =
CLIENT_SECRET =
REDIRECT_URI =

[phone]
PHONE_DELIVERY = local
SMS_GATEWAY_URL =
SMS_GATEWAY_TOKEN =
ZALO_ACCESS_TOKEN =
ZALO_TEMPLATE_ID =
ZALO_CODE_FIELD = otp

[mailer]
EMAIL_SENDER_NAME = BDSPro
EMAIL_SENDER_ADDRESS = no-reply@bdspro.test
EMAIL_SENDER_PASSWORD =
SMTP_ADDRESS = 127.0.0.1:1025
SMTP_AUTH = false
VERIFY_EMAIL_URL = http://localhost:8080/users/verify_email
