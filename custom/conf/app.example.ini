; Development-only local example. Copy to custom/conf/app.ini; do not commit credentials.
RUN_MODE = development

[server]
HTTP_SERVER_ADDRESS = 127.0.0.1:8080

[database]
DB_SOURCE = postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
MIGRATION_URL = file://db/migration

[redis]
ADDR = 127.0.0.1:6379

[log]
MODE = console
FORMAT = console
LEVEL = info
ROOT_PATH = data/log

[log.file]
FILE_NAME = bdspro.log

[security]
TOKEN_SYMMETRIC_KEY = 01234567890123456789012345678901
ACCESS_TOKEN_DURATION = 15m
REFRESH_TOKEN_DURATION = 24h

[cors]
ALLOWED_ORIGINS = http://localhost:3000

; Trusted OpenID Connect issuer. Configure all keys to enable OAuth2/OIDC.
[oauth2]
ISSUER =
AUTHORIZATION_URL =
TOKEN_URL =
JWKS_URL =
CLIENT_ID =
CLIENT_SECRET =
REDIRECT_URI =

[phone]
PHONE_DELIVERY = local
SMS_GATEWAY_URL =
SMS_GATEWAY_TOKEN =
ZALO_ACCESS_TOKEN =
ZALO_TEMPLATE_ID =
ZALO_CODE_FIELD = otp

[mailer]
EMAIL_SENDER_NAME = BDSPro
EMAIL_SENDER_ADDRESS = no-reply@bdspro.test
EMAIL_SENDER_PASSWORD =
SMTP_ADDRESS = 127.0.0.1:1025
SMTP_AUTH = false
VERIFY_EMAIL_URL = http://localhost:8080/users/verify_email
