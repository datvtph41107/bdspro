; BDSPro: file mẫu để dev copy thành custom/conf/app.ini.
; Không lưu secret thật trong git. Cấu hình đang có consumer runtime mới được giữ.
RUN_MODE = development
; WORK_PATH = /absolute/instance/root

[server]
HTTP_SERVER_ADDRESS = 127.0.0.1:8080
PUBLIC_ORIGIN = http://127.0.0.1:8080
; TRUSTED_PROXIES = 192.0.2.10,198.51.100.0/28
HTTP_SHUTDOWN_TIMEOUT = 10s
GRACEFUL_HAMMER_TIMEOUT = 15s

[database]
; slow logs query failures and queries >= threshold; all adds debug query events. No SQL arguments.
LOG_SQL = slow
SLOW_QUERY_THRESHOLD = 200ms
DB_SOURCE = postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
MIGRATION_URL = file://db/migration

[redis]
ADDR = 127.0.0.1:6379

[api]
MAX_RESPONSE_ITEMS = 50
DEFAULT_PAGING_NUM = 20
MAX_REQUEST_BODY_BYTES = 1048576

[log]
MODE = console
FORMAT = console
LEVEL = info
ROOT_PATH = data/log

[log.file]
FORMAT = json
MAX_SIZE_MB = 20
MAX_BACKUPS = 5
MAX_AGE_DAYS = 7
FILE_NAME = bdspro.log

[security]
; Chỉ dùng secret mẫu tại development, thay trước khi triển khai thật.
TOKEN_SYMMETRIC_KEY = 01234567890123456789012345678901
ACCESS_TOKEN_DURATION = 15m
REFRESH_TOKEN_DURATION = 24h
REMEMBER_SESSION_DURATION = 720h

[cors]
ALLOWED_ORIGINS = http://localhost:3000

; [ipactive] dùng defaults từ modules/ipactive; chỉ override khi cần.
; [ipactive]
; LOGIN_LIMIT = 30
; LOGIN_WINDOW = 1m

; Optional password recovery mail transport. Implicit TLS SMTP (typically 465).
; Leave disabled until configured. Never commit credentials.
; [mailer]
; SMTP_PROTOCOL = smtps
; SMTP_ADDRESS = smtp.example.invalid:465
; FROM = security@example.invalid
; USERNAME =
; PASSWORD =

; For local Docker Mailpit, use RUN_MODE = development and:
; SMTP_PROTOCOL = smtp
; SMTP_ADDRESS = 127.0.0.1:1025
; FROM = security@bdspro.test
; Leave USERNAME and PASSWORD empty. If the API runs in Docker, use mailpit:1025.

; Phone OTP transports. See docs/phone-delivery.md.
; [phone_delivery]
; MODE = disabled
; DEFAULT_CHANNEL = sms
; CHANNELS = sms,zalo,telegram
; MODE=mailpit requires development + local plain SMTP above.
; MODE=live requires credentials for every enabled channel.
; [zalo]
; ACCESS_TOKEN =
; TEMPLATE_ID =
; OTP_PARAM = otp
; [telegram_gateway]
; ACCESS_TOKEN =
; Use Gateway credentials, not BotFather tokens.

; Optional SMS delivery: Twilio Programmable Messaging, registered alpha sender.
; Disabled by default. Approve provider, country/template registration and costs first.
; [sms]
; ACCOUNT_SID =
; AUTH_TOKEN =
; SENDER_ID =
; [ipactive] supports SMS_DESTINATION_HOUR/DAY, SMS_GLOBAL_DAY, SMS_VERIFY_DESTINATION limits/windows.

; Optional Google OAuth web client; disabled by default.
; [google]
; CLIENT_ID =
; CLIENT_SECRET =
; CALLBACK_URL = http://localhost:5173/api/v1/auth/google/callback
; CALLBACK_URL must equal server.PUBLIC_ORIGIN + /api/v1/auth/google/callback.
