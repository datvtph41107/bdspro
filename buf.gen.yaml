version: v2
plugins:
  - local: protoc-gen-go
    out: pb
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: pb
    opt:
      - paths=source_relative
  - local: protoc-gen-openapiv2
    out: docs/grpc-swagger
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=bdspro
inputs:
  - directory: proto
    paths:
      - proto/bdspro/v1
