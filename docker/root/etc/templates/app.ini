; Development-only Docker template. Override production secrets at deployment.
RUN_MODE = development

[server]
HTTP_SERVER_ADDRESS = 0.0.0.0:8080
; Empty = ignore forwarded client-IP headers. Set only known ingress peers.
TRUSTED_PROXIES =

[database]
DB_SOURCE = postgresql://root:secret@postgres:5432/bdspro?sslmode=disable
MIGRATION_URL = file://db/migration

[redis]
ADDR = redis:6379

; Optional worker queue settings (defaults 10/10/5).
; Invalid or empty overrides fail worker startup before DB/Redis initialization.
; BDSPro caps: concurrency 256, weight 100 per queue, aggregate 1000.
; [queue]
; CONCURRENCY = 10
; CRITICAL_WEIGHT = 10
; DEFAULT_WEIGHT = 5

[log]
MODE = console
FORMAT = json
LEVEL = info
ROOT_PATH = /data/bdspro/log

[log.file]
FILE_NAME = bdspro.log

[security]
TOKEN_SYMMETRIC_KEY = 01234567890123456789012345678901
ACCESS_TOKEN_DURATION = 15m
REFRESH_TOKEN_DURATION = 24h

; Audit storage is independent of session history and JWT signing.
; Production must supply BDS__AUDIT__HMAC_KEY using a separate secret.
[audit]
HMAC_KEY = abcdef0123456789abcdef0123456789
RETENTION_DAYS = 90

[cors]
ALLOWED_ORIGINS = http://localhost:3000

[oauth2]
ISSUER =
AUTHORIZATION_URL =
TOKEN_URL =
JWKS_URL =
CLIENT_ID =
CLIENT_SECRET =
REDIRECT_URI =

[phone]
PHONE_DELIVERY = local
SMS_GATEWAY_URL =
SMS_GATEWAY_TOKEN =
ZALO_ACCESS_TOKEN =
ZALO_TEMPLATE_ID =
ZALO_CODE_FIELD = otp

[mailer]
EMAIL_SENDER_NAME = BDSPro
EMAIL_SENDER_ADDRESS = no-reply@bdspro.test
EMAIL_SENDER_PASSWORD =
SMTP_ADDRESS = mailpit:1025
SMTP_AUTH = false
VERIFY_EMAIL_URL = http://localhost:8080/users/verify_email
