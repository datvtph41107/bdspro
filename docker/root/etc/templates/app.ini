; Docker template cho bản BDSPro đang vận hành (Web + migrate).
; Production phải inject secrets an toàn qua BDS__SECTION__KEY hoặc __FILE.
RUN_MODE = development
WORK_PATH = /data/bdspro

[server]
HTTP_SERVER_ADDRESS = 0.0.0.0:8080
TRUSTED_PROXIES =
HTTP_SHUTDOWN_TIMEOUT = 10s
GRACEFUL_HAMMER_TIMEOUT = 15s

[database]
DB_SOURCE = postgresql://root:secret@postgres:5432/bdspro?sslmode=disable
; SQL migrations được COPY vào /app/db/migration trong Dockerfile.
; Không phụ thuộc WORK_PATH=/data/bdspro (nơi lưu dữ liệu persistent).
MIGRATION_URL = file:///app/db/migration

[redis]
ADDR = redis:6379

[api]
MAX_RESPONSE_ITEMS = 50
DEFAULT_PAGING_NUM = 20
MAX_REQUEST_BODY_BYTES = 1048576

[log]
MODE = console
FORMAT = json
LEVEL = info
ROOT_PATH = /data/bdspro/log

[log.file]
FILE_NAME = bdspro.log

[security]
TOKEN_SYMMETRIC_KEY = 01234567890123456789012345678901
ACCESS_TOKEN_DURATION = 15m
REFRESH_TOKEN_DURATION = 24h

[cors]
ALLOWED_ORIGINS = http://localhost:3000
