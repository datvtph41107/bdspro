<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Authorize {{.ClientName}} — BDSPro</title></head><body>
<main><h1>Authorize {{.ClientName}}?</h1>
<p>This third-party application requests <strong>{{.Scope}}</strong>: read your BDSPro account identifier. Your email address is not shared.</p>
<p>Application callback: <code>{{.RedirectURI}}</code></p>
<form method="post" action="/oauth/authorize">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input type="hidden" name="consent_proof" value="{{.ConsentProof}}">
<input type="hidden" name="consent_version" value="{{.ConsentVersion}}">
<input type="hidden" name="client_id" value="{{.ClientID}}">
<input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
<input type="hidden" name="response_type" value="{{.ResponseType}}">
<input type="hidden" name="scope" value="{{.Scope}}">
<input type="hidden" name="state" value="{{.State}}">
<input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
<input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
<button type="submit" name="approve" value="true">Authorize</button>
<button type="submit" name="approve" value="false">Deny</button>
</form>
<form method="post" action="/oauth/logout">
<input type="hidden" name="csrf" value="{{.LogoutCSRF}}">
<button type="submit">Sign out</button>
</form></main></body></html>
