name: Temporary Go formatting
on:
  push:
    branches:
      - refactor/explicit-routes-cmd-20261026
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Print exactly formatted source
        run: |
          gofmt -w routes/*.go app/http/controllers/auth/*.go app/http/controllers/api/*.go auth/*.go app/http/server/*.go
          git diff --name-only -- '*.go' | while IFS= read -r file; do
            printf '__GOBEGIN__%s\n' "$file"
            base64 -w0 "$file"
            printf '\n__GOEND__%s\n' "$file"
          done
