name: R11 temporary gofmt
on:
  push:
    branches: [refactor/gitea-http-lifecycle-r11]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format moved HTTP lifecycle code
        run: |
          gofmt -w cmd/http.go cmd/http_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cmd/http.go cmd/http_test.go
            git commit -m "style(cmd): gofmt HTTP lifecycle on Go 1.27.3"
            git push origin HEAD:refactor/gitea-http-lifecycle-r11
          fi
