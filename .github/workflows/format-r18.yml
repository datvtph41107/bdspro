# Temporary branch-only formatting gate; removed after the source is formatted.
name: Format R18
on:
  push:
    branches: [refactor/models-auth-errors-r18]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt and commit source
        run: |
          gofmt -w models/account/error.go models/auth models/organization modules/validation services/auth routers/api/response routers/api/v1/org/org.go
          git add -- models/account/error.go models/auth models/organization modules/validation services/auth routers/api/response routers/api/v1/org/org.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: gofmt model-owned errors and auth code'
            git push origin HEAD:refactor/models-auth-errors-r18
          fi
