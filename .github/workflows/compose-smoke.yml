name: Docker Compose smoke test

on:
  push:
    branches: [dev]
    paths:
      - "Dockerfile"
      - "docker-compose.yaml"
      - "start.sh"
      - "wait-for.sh"
      - "main.go"
      - ".github/workflows/compose-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated stack
        run: docker compose up --build --detach
      - name: Verify HTTP, OpenAPI and gRPC gateway registration
        run: |
          set -e
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18080/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:18080/health
          curl --fail --silent --show-error http://127.0.0.1:18080/docs/openapi.json | python3 -c 'import json,sys; doc=json.load(sys.stdin); assert "swagger" in doc or "openapi" in doc'
          curl --fail --show-error --silent \
            -H "Content-Type: application/json" \
            -d '{"email":"compose-smoke@example.test","password":"strong-password-123"}' \
            http://127.0.0.1:18080/v1/users | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["account"]["account_id"] != "0"'
      - name: Exercise Organization auth over Gin and gRPC Gateway
        run: |
          python3 - <<'PY'
          import json
          import uuid
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18080"
          def call(method, path, body=None, token=None, expected=200):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      status = response.status
                      payload = json.loads(response.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  payload = json.loads(exc.read() or b"{}")
              assert status == expected, (method, path, status, expected, payload)
              return payload

          def login():
              email = str(uuid.uuid4()) + "@example.test"
              body = {"email": email, "password": "strong-password-123"}
              call("POST", "/v1/users", body, expected=200)
              return call("POST", "/v1/users/login", body)["access_token"], body

          owner, _ = login()
          org = call("POST", "/organizations", {"name": "Initial Org"}, owner, 201)
          org_id = org["party_id"]
          changed = call("PATCH", f"/organizations/{org_id}", {"name": "Gin Rename"}, owner)
          assert changed["name"] == "Gin Rename"
          changed = call("PATCH", f"/v1/organizations/{org_id}", {"name": "gRPC Rename"}, owner)
          assert changed["organization"]["name"] == "gRPC Rename"
          member, _ = login()
          call("PATCH", f"/v1/organizations/{org_id}", {"name": "Unauthorized"}, member, 403)
          call("PATCH", f"/v1/organizations/{org_id}", {"name": "No Token"}, expected=401)
          print("Organization owner rules verified over Gin and gRPC Gateway")
          PY
      - name: Check container startup and database migrations
        run: |
          docker compose exec -T api sh -c "test -x /app/start.sh && test -x /app/wait-for.sh && nc -z postgres 5432 && nc -z redis 6379"
          current="$(docker compose exec -T postgres psql -U root -d bdspro -tAc 'SELECT version || chr(124) || dirty FROM schema_migrations')"
          test "$current" = "3|false" || test "$current" = "3|f"
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes
