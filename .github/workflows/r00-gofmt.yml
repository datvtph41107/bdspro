name: Format R00 source

on:
  push:
    branches: [refactor/gitea-runtime-r00]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/gitea-runtime-r00
          persist-credentials: true
      - name: Apply canonical gofmt formatting
        run: |
          find . -type f -name '*.go' -not -path './.git/*' -print0 | xargs -0 -r gofmt -w
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          if ! git diff --cached --quiet; then
            git commit -m "style: apply gofmt to R00 source"
            git push origin HEAD:refactor/gitea-runtime-r00
          fi
