name: CORE-01 Party C01 PostgreSQL proof

on:
  pull_request:
    branches: [dev]
    paths:
      - "party/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/core01-postgres.yml"
  workflow_dispatch:

jobs:
  core01:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bdspro
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: bdspro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdspro -d bdspro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      CORE_TEST_DATABASE_URL: postgresql://bdspro:local-test-only@localhost:5432/bdspro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply existing Listing migrations and CORE-01 migration
        run: |
          set -euo pipefail
          for migration in migrations/*.up.sql; do
            echo "Applying $migration"
            psql "$CORE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run standard Go tests
        run: go test ./... -count=1

      - name: Prove C01 against real PostgreSQL and conflicting transactions
        run: go test -tags=integration ./party -count=1 -v

      - name: Prove reverse migration and clean reapplication
        run: |
          set -euo pipefail
          psql "$CORE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000006_create_party_identity.down.sql
          missing="$(psql "$CORE_TEST_DATABASE_URL" -At -c "SELECT to_regclass('public.parties') IS NULL AND to_regclass('public.persons') IS NULL AND to_regclass('public.organizations') IS NULL")"
          test "$missing" = "t"
          psql "$CORE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000006_create_party_identity.up.sql
          go test -tags=integration ./party -count=1
