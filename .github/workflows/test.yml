name: Infrastructure verification

on:
  push:
    branches: [dev, 'refactor/**', 'feature/**']
  pull_request:
    branches: [dev, 'refactor/**', 'feature/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Go module graph is tidy
        run: go mod tidy -diff

      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Verify source boundaries after domain reset
        run: go test ./tests/architecture -count=1

      - name: Verify SQLC generated output
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          make sqlc-check

      - name: Build all packages
        run: go build ./...

      - name: Run infrastructure tests with race detector
        env:
          BDS_TEST_MODE: disposable
          BDS_TEST_DB_URL: postgres://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
          BDS_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test -race ./...
          go vet ./...

      - name: Verify SQL migrations on disposable database
        env:
          PGPASSWORD: secret
          BDS__DATABASE__DB_SOURCE: postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bdspro_test'
          make migrateup

      - name: Verify Docker deployment matches infrastructure CLI
        run: |
          docker compose config --quiet
          docker compose build api

      - name: HTTP runtime smoke test
        run: |
          go build -o /tmp/bdspro-smoke .
          /tmp/bdspro-smoke --config custom/conf/app.example.ini web > /tmp/bdspro-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/bdspro-smoke.log; exit 1; fi
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
