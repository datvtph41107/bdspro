name: Build and HTTP smoke

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PR guard compares base tree to merge commit

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Only PRs compare committed migration history against the PR base.
      # Full checkout history makes the exact PR base commit available.
      - name: Protect migration history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA" HEAD
          sh scripts/check-migration-history.sh "$BASE_SHA" HEAD

      - name: Run migrations
        run: make migrateup

      - name: Verify core source baseline
        run: sh scripts/check-core-source-baseline.sh

      - name: Verify current source ownership
        run: sh scripts/check-core-current-source.sh --summary

      - name: Build and Compose validation
        run: |
          go build ./...
          docker compose config --quiet
          sh -n scripts/accept-g0.sh
          sh -n scripts/check-migration-history.sh

      - name: Runtime smoke
        env:
          DB_SOURCE: postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
          REDIS_ADDRESS: 127.0.0.1:6379
          SMTP_ADDRESS: 127.0.0.1:1025
          SMTP_AUTH: "false"
          EMAIL_SENDER_ADDRESS: no-reply@bdspro.test
          LOG_FORMAT: json
        run: |
          go build -o /tmp/bdspro-api ./cmd/bdspro
          /tmp/bdspro-api > /tmp/bdspro-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/bdspro-api.log
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/users/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/users/google/login/start)" = "404"
          echo "HTTP runtime smoke passed"

      - name: Static analysis
        run: go vet ./...
