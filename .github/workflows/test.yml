name: Run unit tests

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run migrations
        run: make migrateup

      - name: Run tests
        env:
          REDIS_TEST_ADDRESS: 127.0.0.1:6379
          MAILPIT_API_URL: http://127.0.0.1:8025
          MAILPIT_SMTP_ADDRESS: 127.0.0.1:1025
        run: make test

      - name: Build and Compose validation
        run: |
          go build ./...
          docker compose config --quiet
          sh -n scripts/accept-g0.sh

      - name: Runtime smoke
        env:
          DB_SOURCE: postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
          REDIS_ADDRESS: 127.0.0.1:6379
          SMTP_ADDRESS: 127.0.0.1:1025
          SMTP_AUTH: "false"
          EMAIL_SENDER_ADDRESS: no-reply@bdspro.test
          LOG_FORMAT: json
        run: |
          go build -o /tmp/bdspro-api .
          /tmp/bdspro-api > /tmp/bdspro-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/bdspro-api.log
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/users/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/users/google/login/start)" = "404"
          echo "HTTP runtime smoke passed"

      - name: Static analysis
        run: go vet ./...

      - name: Race detector
        env:
          REDIS_TEST_ADDRESS: 127.0.0.1:6379
          MAILPIT_API_URL: http://127.0.0.1:8025
          MAILPIT_SMTP_ADDRESS: 127.0.0.1:1025
        run: go test -race -count=1 ./api ./db/sqlc ./worker
