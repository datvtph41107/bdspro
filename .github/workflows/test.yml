name: Run unit tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify SQLC generated output
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/database
          test -z "$(git ls-files --others --exclude-standard internal/database)"

      - name: Verify OpenAPI contract
        run: make swagger

      - name: Migrate disposable test database
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bdspro_test'
          DB_URL='postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable' make migrateup

      - name: Test upgrading existing accounts and outbox records
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bdspro_upgrade_test'
          UPGRADE_URL='postgres://root:secret@127.0.0.1:5432/bdspro_upgrade_test?sslmode=disable'
          migrate -path db/migration -database "$UPGRADE_URL" up 6
          psql -h 127.0.0.1 -U root -d bdspro_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO parties(id) OVERRIDING SYSTEM VALUE VALUES (1), (2);
          INSERT INTO persons(party_id) VALUES (1), (2);
          INSERT INTO accounts(id, person_id, email, password_hash) OVERRIDING SYSTEM VALUE
          VALUES (1, 1, 'old1@example.test', 'legacy-hash-1'), (2, 2, 'old2@example.test', 'legacy-hash-2');
          INSERT INTO verification_outbox(id, account_id, queued_at) OVERRIDING SYSTEM VALUE
          VALUES (19, 1, NULL), (21, 2, now());
          SQL
          migrate -path db/migration -database "$UPGRADE_URL" up 1
          psql -h 127.0.0.1 -U root -d bdspro_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          BEGIN
            IF (SELECT count(*) FROM job_outbox) <> 2
                OR (SELECT count(*) FROM job_outbox WHERE queued_at IS NULL) <> 1
                OR (SELECT count(*) FROM job_outbox WHERE queued_at IS NOT NULL) <> 1
                OR (SELECT task_type FROM job_outbox WHERE id = 19) <> 'task:send_verify_email'
                OR (SELECT payload->>'account_id' FROM job_outbox WHERE id = 19) <> '1'
                OR (SELECT task_id FROM job_outbox WHERE id = 19) <> 'verify-email-outbox-19'
                OR to_regclass('public.verification_outbox') IS NOT NULL
                OR nextval(pg_get_serial_sequence('job_outbox','id')) <= 21 THEN
              RAISE EXCEPTION 'outbox migration did not preserve pending task state';
            END IF;
          END $audit$;
          SQL
          migrate -path db/migration -database "$UPGRADE_URL" up 1
          psql -h 127.0.0.1 -U root -d bdspro_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          BEGIN
            IF (SELECT count(*) FROM password_credentials) <> 2
                OR (SELECT password_hash FROM password_credentials WHERE account_id = 1) <> 'legacy-hash-1'
                OR EXISTS (
                    SELECT 1 FROM information_schema.columns
                    WHERE table_name = 'accounts' AND column_name = 'password_hash'
                ) THEN
              RAISE EXCEPTION 'password credential migration lost an existing hash';
            END IF;
          END $audit$;
          SQL

      - name: Verify profile backfill for existing accounts
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bdspro_profile_upgrade_test'
          PROFILE_URL='postgres://root:secret@127.0.0.1:5432/bdspro_profile_upgrade_test?sslmode=disable'
          migrate -path db/migration -database "$PROFILE_URL" up 11
          psql -h 127.0.0.1 -U root -d bdspro_profile_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO parties (id) OVERRIDING SYSTEM VALUE VALUES (9801);
          INSERT INTO persons (party_id) VALUES (9801);
          INSERT INTO accounts (person_id, email) VALUES (9801, 'old-profile@example.test');
          SQL
          migrate -path db/migration -database "$PROFILE_URL" up 1
          psql -h 127.0.0.1 -U root -d bdspro_profile_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM person_profiles WHERE person_id=9801 AND display_name='')
               OR NOT EXISTS (SELECT 1 FROM account_settings WHERE account_id=(SELECT id FROM accounts WHERE person_id=9801)
                   AND locale='vi' AND currency='VND' AND timezone='Asia/Ho_Chi_Minh') THEN
              RAISE EXCEPTION 'profile migration lost or fabricated existing account information';
            END IF;
          END $audit$;
          SQL

      - name: Verify organization member rename preserves existing data
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bdspro_org_upgrade_test'
          ORG_URL='postgres://root:secret@127.0.0.1:5432/bdspro_org_upgrade_test?sslmode=disable'
          migrate -path db/migration -database "$ORG_URL" up 10
          psql -h 127.0.0.1 -U root -d bdspro_org_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO parties (id) OVERRIDING SYSTEM VALUE VALUES (901), (902);
          INSERT INTO persons (party_id) VALUES (901), (902);
          INSERT INTO organizations (party_id, name) VALUES (901, 'Upgrade fixture');
          INSERT INTO organization_memberships (organization_id, person_id, role, ended_at)
          VALUES (901, 901, 'owner', NULL), (901, 902, 'member', now());
          SQL
          migrate -path db/migration -database "$ORG_URL" up 1
          psql -h 127.0.0.1 -U root -d bdspro_org_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          BEGIN
            IF to_regclass('public.organization_members') IS NULL
              OR to_regclass('public.organization_memberships') IS NOT NULL
              OR to_regclass('public.organization_members_one_open_uq') IS NULL
              OR (SELECT count(*) FROM organization_members WHERE organization_id = 901) <> 2
              OR (SELECT count(*) FROM organization_members WHERE role = 'owner' AND ended_at IS NULL) <> 1
              OR (SELECT count(*) FROM organization_members WHERE role = 'member' AND ended_at IS NOT NULL) <> 1
            THEN
              RAISE EXCEPTION 'organization member rename did not preserve data or constraints';
            END IF;
          END $audit$;
          SQL
          migrate -path db/migration -database "$ORG_URL" down 1
          psql -h 127.0.0.1 -U root -d bdspro_org_upgrade_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          BEGIN
            IF to_regclass('public.organization_memberships') IS NULL
              OR to_regclass('public.organization_members') IS NOT NULL
              OR (SELECT count(*) FROM organization_memberships WHERE organization_id = 901) <> 2
            THEN
              RAISE EXCEPTION 'organization member rename is not reversible';
            END IF;
          END $audit$;
          SQL

      - name: Format and snapshot profile source
        run: |
          gofmt -w internal/api/handler/profile_resource.go internal/api/handler/requests.go internal/api/routes_test.go internal/api/account_profile_e2e_test.go internal/service/profile_test.go internal/service/profile.go internal/api/handler/profile.go
          for generated in internal/api/handler/profile_resource.go internal/api/handler/requests.go internal/api/routes_test.go internal/api/account_profile_e2e_test.go internal/service/profile_test.go internal/service/profile.go internal/api/handler/profile.go; do
            echo "GOFMT_BEGIN:$generated"
            base64 -w0 "$generated"
            echo
            echo "GOFMT_END:$generated"
          done

      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test and compile
        env:
          BDS_TEST_MODE: disposable
          BDS_TEST_DB_URL: postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable
        run: |
          make test
          go test -race ./...
          go vet ./...
          go build ./...

      - name: HTTP runtime smoke test
        run: |
          docker compose config --quiet
          go build -o /tmp/bdspro-smoke .
          /tmp/bdspro-smoke > /tmp/bdspro-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/bdspro-smoke.log; exit 1; fi
          curl -fsS http://127.0.0.1:8080/swagger/openapi.json > /tmp/bdspro-swagger.json
          python3 -c 'import json; x=json.load(open("/tmp/bdspro-swagger.json")); assert x["openapi"] == "3.0.3"'
          status=$(curl -s -o /tmp/noauth.json -w "%{http_code}" http://127.0.0.1:8080/users/me)
          test "$status" = 401
          python3 -c 'import json; e=json.load(open("/tmp/noauth.json")); assert e["code"] == "unauthenticated"'
