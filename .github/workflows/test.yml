name: Run unit tests

on:
  push:
    branches: [dev, 'refactor/**', 'feature/**']
  pull_request:
    branches: [dev, 'refactor/**', 'feature/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Go module graph is tidy
        run: go mod tidy -diff

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify package ownership
        run: go test ./tests/architecture -count=1

      - name: Verify SQLC generated output
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          make sqlc-check

      # Test the canonical db execution core independently while legacy
      # domain consumers are being migrated out of models/db.
      - name: Verify canonical database core
        env:
          BDS_TEST_DB_URL: postgres://root:secret@127.0.0.1:5432/bdspro?sslmode=disable
        run: |
          go test -race -count=1 \
            models/db/conn.go \
            models/db/engine.go \
            models/db/engine_init.go \
            models/db/context.go \
            models/db/error.go \
            models/db/sqlc_types.gen.go \
            models/db/core_context_test.go \
            models/db/core_postgres_test.go

      - name: Verify OpenAPI contract
        run: go test ./routers -run TestOpenAPICoverage -count=1

      - name: Migrate disposable test database
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bdspro_test'
          BDS__DATABASE__DB_SOURCE='postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable' make migrateup

      - name: Verify canonical fresh schema and refuse historical migration versions
        env:
          PGPASSWORD: secret
          BDS_TEST_MODE: disposable
        run: bash tests/integration/migrations/canonical-schema.sh

      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Verify embedded OpenAPI contract and UI
        run: |
          make swagger-check
          python3 -c 'import json; assert json.load(open("templates/swagger/openapi.json"))["openapi"] == "3.0.3"'
          git diff --exit-code -- templates/swagger/openapi.json

      - name: Verify cleanup works without Redis
        env:
          BDS__DATABASE__DB_SOURCE: postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable
          BDS__REDIS__ADDR: 127.0.0.1:1
        run: go run . --config custom/conf/app.example.ini cleanup

      - name: Test and compile
        env:
          BDS_TEST_MODE: disposable
          BDS_TEST_DB_URL: postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable
          BDS_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          make test
          go test -race ./...
          go vet ./...
          go build ./...
          make build
          test -x bin/bdspro
          ./bin/bdspro migrate --help

      - name: Verify Asynq worker crash and automatic lease recovery
        env:
          BDS_G1_PROCESS_TEST: "1"
          BDS_TEST_MODE: disposable
          BDS_TEST_DB_URL: postgres://root:secret@127.0.0.1:5432/bdspro_test?sslmode=disable
          BDS_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test ./services/worker -run '^TestG1WorkerCrashAfterMailDeliveryAndAutomaticRecovery$' -count=1 -timeout=5m -v

      - name: Verify unchanged Gin route inventory
        run: go run ./tools/r02audit -root . -contract docs/architecture/r02/routes-r01.json -additions docs/architecture/r02/routes-r20-additions.json,docs/architecture/r02/routes-r23-additions.json,docs/architecture/r02/routes-r24-additions.json,docs/architecture/r02/routes-r31-additions.json,docs/architecture/r02/routes-r36-additions.json,docs/architecture/r02/routes-r38-additions.json,docs/architecture/r02/routes-g1-2c8-additions.json,docs/architecture/r02/routes-g1-2c8b-additions.json,docs/architecture/r02/routes-orgs-additions.json -removals docs/architecture/r02/routes-orgs-combined-removals.json

      - name: Benchmark production Gin router
        run: go test ./routers/api -run '^$' -bench '^BenchmarkGinRouting$' -benchmem -count=3

      - name: Verify Docker runtime image
        run: |
          sh -n docker/setup
          docker compose build api worker
          docker run --rm --entrypoint /app/main bdspro:local --version

      - name: HTTP runtime smoke test
        run: |
          docker compose config --quiet
          go build -o /tmp/bdspro-smoke .
          /tmp/bdspro-smoke --config custom/conf/app.example.ini web > /tmp/bdspro-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/bdspro-smoke.log; exit 1; fi
          curl -fsS http://127.0.0.1:8080/swagger/openapi.json > /tmp/bdspro-swagger.json
          python3 -c 'import json; x=json.load(open("/tmp/bdspro-swagger.json")); assert x["openapi"] == "3.0.3"'
          status=$(curl -s -o /tmp/noauth.json -w "%{http_code}" http://127.0.0.1:8080/users/me)
          test "$status" = 401
          python3 -c 'import json; e=json.load(open("/tmp/noauth.json")); assert e["code"] == "unauthenticated"'
