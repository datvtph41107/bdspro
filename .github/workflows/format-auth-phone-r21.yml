# One-shot branch-only gofmt, deleted immediately after source formatting.
name: Format OTP R21
on:
  push:
    branches: [refactor/auth-phone-ownership-r21]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt to OTP model tests
        run: |
          gofmt -w models/auth/phone_integration_test.go
          git add -- models/auth/phone_integration_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(auth): gofmt OTP PostgreSQL integration tests'
            git push origin HEAD:refactor/auth-phone-ownership-r21
          fi
