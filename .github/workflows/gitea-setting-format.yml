name: Format canonical setting refactor
on:
  push:
    branches: ['refactor/gitea-setting-canonical']
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/gitea-setting-canonical
          persist-credentials: true
      - name: Format changed Go code
        run: |
          gofmt -w modules/setting/*.go cmd/*.go routers/init.go routers/app.go
          git add modules/setting cmd routers/init.go routers/app.go
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: gofmt canonical settings and CLI'
          git push origin HEAD:refs/heads/refactor/gitea-setting-canonical
