name: One-time Go formatting

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Go code and tidy dependencies
        run: |
          gofmt -w .
          go mod tidy
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(go): format source and tidy module dependencies'
            git push origin HEAD:dev
          fi
