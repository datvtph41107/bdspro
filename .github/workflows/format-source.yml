name: Temporary gofmt source proof
on:
  push:
    branches:
      - refactor/explicit-routes-cmd-20261026
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed runtime source and print exact bytes
        run: |
          gofmt -w cmd/bdspro/main.go db/open.go routes/*.go app/http/middleware/*.go app/http/request/*.go app/http/controllers/auth/*.go app/http/controllers/api/*.go app/http/server/*.go
          git diff --name-only -- '*.go' | while IFS= read -r file; do
            printf '__FORMAT_BEGIN__%s\n' "$file"
            base64 -w0 "$file"
            printf '\n__FORMAT_END__%s\n' "$file"
          done
