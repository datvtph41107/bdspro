# Temporary one-shot formatter on a dedicated feature branch.
name: Format Team API R20
on:
  push:
    branches: [refactor/team-error-contract-r20]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt to Team API and commit
        run: |
          gofmt -w modules/structs/team.go services/convert/team.go routers/api/v1/org/team.go routers/api/v1/org/team_test.go routers/routes_test.go routers/routes_group_test.go
          git add -- modules/structs/team.go services/convert/team.go routers/api/v1/org/team.go routers/api/v1/org/team_test.go routers/routes_test.go routers/routes_group_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(team): gofmt handlers, DTOs, converter and route tests'
            git push origin HEAD:refactor/team-error-contract-r20
          fi
