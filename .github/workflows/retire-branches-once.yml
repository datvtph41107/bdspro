name: Retire old branches once

on:
  workflow_run:
    workflows: ["Run unit tests"]
    branches: [dev]
    types: [completed]

permissions:
  contents: write

jobs:
  retire:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - name: Archive branch pointers and retire non-dev branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p docs/operations
          {
            printf 'branch\tcommit_sha\n'
            git ls-remote --heads origin | awk '{ ref=$2; sub(/^refs\/heads\//, "", ref); if (ref != "dev") print ref "\t" $1 }' | LC_ALL=C sort
          } > docs/operations/retired-branches-2026-10-26.tsv
          git add docs/operations/retired-branches-2026-10-26.tsv
          git commit -m "docs(operations): checkpoint retired branch tips before cleanup"
          git push origin HEAD:dev

          failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "dev" ] && continue
            echo "Retiring branch: $branch"
            if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" > /dev/null; then
              echo "::error::Could not retire $branch"
              failed=1
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')

          git rm .github/workflows/retire-branches-once.yml
          git commit -m "chore(ci): remove one-time branch retirement job"
          git push origin HEAD:dev
          exit "$failed"
