name: BDSPro Core End-to-End CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  canonical-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: secret
      SOURCE_TEST_DATABASE_URL: postgresql://root:secret@localhost:5432/bdspro_source_ci?sslmode=disable
      CORE_TEST_DATABASE_URL: postgresql://root:secret@localhost:5432/bdspro_core_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install sqlc and golang-migrate
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.0
      - name: Apply canonical migrations
        run: |
          createdb -h localhost -U root bdspro_source_ci
          createdb -h localhost -U root bdspro_core_ci
          for database in bdspro_source_ci bdspro_core_ci; do
            for migration in migrations/*.up.sql; do
              psql -v ON_ERROR_STOP=1 -h localhost -U root -d "$database" -f "$migration"
            done
          done
      - name: Verify golang-migrate versioned UP-DOWN-UP
        run: |
          createdb -h localhost -U root bdspro_migrate_ci
          url='postgresql://root:secret@localhost:5432/bdspro_migrate_ci?sslmode=disable'
          migrate -path migrations -database "$url" -verbose up
          migrate -path migrations -database "$url" version
          migrate -path migrations -database "$url" -verbose down 1
          migrate -path migrations -database "$url" -verbose up 1
      - name: Generate SQLC query package
        run: sqlc generate
      - name: Resolve generated Go dependencies
        run: go mod tidy
      - name: Enforce generated and formatted files checked in
        run: |
          gofmt -w auth organization source main.go integration_test.go party_kind_test.go
          git diff --exit-code -- go.mod go.sum db/sqlc auth organization source main.go integration_test.go party_kind_test.go
          test -z "$(git ls-files --others --exclude-standard -- db/sqlc)"
          go vet ./...
      - name: PostgreSQL integration and full build
        run: go test ./... -count=1 -v
      - name: Verify migration rollback in disposable DB
        run: |
          for migration in $(find migrations -maxdepth 1 -name '*.down.sql' | sort -r); do
            psql -v ON_ERROR_STOP=1 -h localhost -U root -d bdspro_source_ci -f "$migration"
          done
          for migration in migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U root -d bdspro_source_ci -f "$migration"
          done
      - name: Smoke server startup
        run: |
          set +e
          APP_ENV=development DATABASE_URL="$CORE_TEST_DATABASE_URL" PORT=0 timeout 6s go run . >server.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then cat server.log; exit 1; fi
          grep 'BDSPro listening' server.log
