name: IAM logging acceptance

on:
  push:
    branches:
      - feature/iam-v1-implementation
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run deferred vet, Go tests, race tests and benchmark
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install repository Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify revision and dependencies
        run: |
          git rev-parse HEAD
          go version
          go mod download
          go mod verify
      - name: Check formatting of verification policy source
        run: |
          files="$(gofmt -l services/auth/registration.go services/auth/phone.go services/auth/contact_link.go routers/api/v1/auth/registration.go)"
          test -z "$files" || { gofmt -d services/auth/registration.go services/auth/phone.go services/auth/contact_link.go routers/api/v1/auth/registration.go; exit 1; }
      - name: Check formatting of Google flow source
        run: |
          files="$(gofmt -l routers/api/v1/auth/google.go routers/api/v1/auth/google_authenticated.go models/db/google_flow_test.go)"
          test -z "$files" || { gofmt -d routers/api/v1/auth/google.go routers/api/v1/auth/google_authenticated.go models/db/google_flow_test.go; exit 1; }
      - name: Check formatting of session issuance
        run: |
          test -z "$(gofmt -l services/auth/login.go)" || { gofmt -d services/auth/login.go; exit 1; }
      - name: Verify time policy boundaries
        run: |
          go test ./models/organization -run '^TestTeamInviteDuration$' -count=1
          BDS_TEST_REDIS_ADDR=127.0.0.1:6379 go test ./modules/ipactive -run '^TestRetryAfterCeiling$' -count=1
      - name: Build
        run: go build ./...
      - name: Verify canonical pagination contract
        run: go test ./services/context -run '^TestLinkHeaderUsesValidatedPage$' -count=1
      - name: Verify access token contracts
        run: |
          test -z "$(gofmt -l modules/auth/jwt.go modules/auth/jwt_payload.go modules/auth/runtime.go modules/auth/jwt_deadline_test.go modules/auth/jwt_test.go services/auth/access.go)" || { gofmt -d modules/auth/jwt.go modules/auth/jwt_payload.go modules/auth/runtime.go modules/auth/jwt_deadline_test.go modules/auth/jwt_test.go services/auth/access.go; exit 1; }
          go test ./modules/auth -run '^Test(SessionAccessTokenDeadline|AccessTokenContract)$' -count=1
          if git grep -nE '\b(WithMaker|MakerFromContext|CreateToken|NewPayload|VerifyToken|TokenTypeRefresh|TokenTypeAccess)\b' -- '*.go' 'scripts/*.sh' 'scripts/*.py'; then
            echo "Obsolete JWT contract still has a consumer"
            exit 1
          fi
      - name: Verify password format, policy and shared capacity
        run: |
          test -z "$(gofmt -l modules/auth/password.go modules/auth/password_test.go services/auth/password.go services/auth/login.go services/auth/reauth.go)" || { gofmt -d modules/auth/password.go modules/auth/password_test.go services/auth/password.go services/auth/login.go services/auth/reauth.go; exit 1; }
          go test ./modules/auth -run '^Test(VersionedPasswordHash|LegacyPasswordAndPolicy|PasswordCompatibilityAndCapacity)$' -count=1 -v
      - name: Verify OTP format and v1 MAC compatibility
        run: |
          test -z "$(gofmt -l modules/auth/otp.go modules/auth/phone.go modules/auth/otp_test.go services/mailer/registration.go)" || { gofmt -d modules/auth/otp.go modules/auth/phone.go modules/auth/otp_test.go services/mailer/registration.go; exit 1; }
          go test ./modules/auth -run '^Test(OTPWireCompatibility|OTPDecimalFormat|RegistrationCodeBinding|PhoneNormalizationAndMAC|ContactLinkCodeBinding)$' -count=1 -v
      - name: Verify opaque proof and refresh wire compatibility
        run: |
          test -z "$(gofmt -l modules/auth/proof.go modules/auth/recovery_test.go modules/auth/refresh.go modules/auth/refresh_test.go services/mailer/password.go services/mailer/team_invite.go)" || { gofmt -d modules/auth/proof.go modules/auth/recovery_test.go modules/auth/refresh.go modules/auth/refresh_test.go services/mailer/password.go services/mailer/team_invite.go; exit 1; }
          go test ./modules/auth -run '^Test(OpaqueProof|OpaqueProofWireCompatibility|RefreshCredential|RefreshWireCompatibility)$' -count=1 -v
          if git grep -nE '\b(NewRecoveryProof|RecoveryDigest|ErrRecoveryProof)\b' -- '*.go' 'scripts/*.sh' 'scripts/*.py'; then
            echo "Obsolete proof naming still has a consumer"
            exit 1
          fi
      - name: Verify removal of unused browser codec
        run: |
          test -z "$(gofmt -l routers/api/v1/auth/browser.go routers/api/v1/auth/session.go)" || { gofmt -d routers/api/v1/auth/browser.go routers/api/v1/auth/session.go; exit 1; }
          if git grep -nE '\b(BrowserSessionCodec|NewBrowserSessionCodec|BrowserSessionCookie|BrowserCookieName|BrowserSessionTTL|BrowserCSRFTokenTTL|ErrBrowserProofInvalid|BrowserNextPath|VerifyBrowserPostOrigin|IssueCSRF|VerifyCSRF|IssueCookie|ReadCookie|canonicalUUID|deriveBrowserKey|validBrowserMAC|signBrowser|validBrowserPurpose)\b|__Host-bdspro-browser|bdspro_browser_dev|bdspro\.browser\.(session|csrf)\.v1' -- '*.go' 'frontend/src/*' 'frontend/test/*' 'scripts/*.sh' 'scripts/*.py'; then
            echo "Removed browser codec still has a source consumer"
            exit 1
          fi
      - name: Verify Google authorization, exchange and ID-token contracts
        run: |
          test -z "$(gofmt -l modules/auth/google.go modules/auth/google_test.go modules/auth/google_stepup_test.go modules/auth/google_exchange_test.go services/auth/google.go services/auth/google_authenticated.go routers/api/v1/auth/google.go)" || { gofmt -d modules/auth/google.go modules/auth/google_test.go modules/auth/google_stepup_test.go modules/auth/google_exchange_test.go services/auth/google.go services/auth/google_authenticated.go routers/api/v1/auth/google.go; exit 1; }
          go test ./modules/auth -run '^TestGoogle(AuthorizationURL|Claims|StepUp|ExchangeContract|ExchangeCapacity)$' -count=1 -v
      - name: Verify canonical IAM key policy and full auth module
        run: |
          test -z "$(gofmt -l modules/setting/security.go modules/setting/security_test.go modules/auth/jwt.go modules/auth/refresh.go modules/auth/key_policy_test.go)" || { gofmt -d modules/setting/security.go modules/setting/security_test.go modules/auth/jwt.go modules/auth/refresh.go modules/auth/key_policy_test.go; exit 1; }
          go test ./modules/setting -run '^TestTokenSigningKeyPolicy$' -count=1 -v
          go test ./modules/auth -count=1 -v
          go test -race ./modules/auth -count=1
          echo "IAM key consumers (source inventory):"
          git grep -n 'TokenSymmetricKey' -- '*.go' ':!*_test.go'
      - name: Verify PostgreSQL pool and engine lifecycle
        run: |
          test -z "$(gofmt -l models/db/conn.go models/db/engine_init.go models/db/engine_test.go models/db/context.go models/db/context_test.go models/db/transaction.go models/db/transaction_test.go models/db/error.go models/db/google_flow_test.go models/db/migration_test.go)" || { gofmt -d models/db/conn.go models/db/engine_init.go models/db/engine_test.go models/db/context.go models/db/context_test.go models/db/transaction.go models/db/transaction_test.go models/db/error.go models/db/google_flow_test.go models/db/migration_test.go; exit 1; }
          if git grep -nE '\bdb\.Connect\(' -- '*.go' 'scripts/*.sh' 'scripts/*.py'; then
            echo "Removed pool forwarding API still has a consumer"
            exit 1
          fi
          BDSPRO_ENGINE_TEST_DATABASE_URL=postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable go test -race ./models/db -run '^Test(PostgresPoolReadiness|DefaultEngineLifecycle|QueryContextRejection)$' -count=1 -v
      - name: Verify generated query-only business boundary
        run: |
          if git grep -nE '\bdb\.New\(' -- '*.go' 'scripts/*.sh' 'scripts/*.py'; then
            echo "Removed SQLC forwarding constructor still has a consumer"
            exit 1
          fi
          if git grep -nE '\bGetEngine\(' -- '*.go'; then
            echo "Removed raw SQL accessor still has a consumer"
            exit 1
          fi
          if git grep -nE '\.(Exec|Query|QueryRow)\(' -- 'services/auth/*.go' 'services/org/*.go' 'services/jobs/*.go' 'models/party/*.go'; then
            echo "Use canonical SQLC queries in business workflows"
            exit 1
          fi
          test -z "$(gofmt -l services/auth/password.go services/auth/profile.go)" || { gofmt -d services/auth/password.go services/auth/profile.go; exit 1; }
      - name: Verify direct SQLC ownership
        run: |
          test ! -e models/db/sqlc_types.gen.go
          test ! -d tools/dbalias
          if git grep -nE 'type [[:alnum:]_]+ = sqlc\.' -- '*.go' ':!models/db/sqlc/*'; then
            echo "Do not re-export generated SQLC types"
            exit 1
          fi
          go test ./services/auth ./services/org ./services/jobs ./models/party -count=1
      - name: Verify provider lifetime projection
        run: go test ./services/phonedelivery -run '^TestProviderContracts$' -count=1
      - name: Local HTTP and JSON correlation
        shell: bash
        run: |
          set -euo pipefail
          # All state is disposable; never use repository or deployment secrets.
          make config-local
          sed -i 's/^MODE = console$/MODE = console,file/' custom/conf/app.ini
          sed -i '/^\[log.file\]$/a LEVEL = debug' custom/conf/app.ini
          # Development inbox only: never send real SMS/email.
          export BDS__PHONE_DELIVERY__MODE=mailpit
          export BDS__PHONE_DELIVERY__DEFAULT_CHANNEL=sms
          export BDS__PHONE_DELIVERY__CHANNELS=sms,zalo,telegram
          export BDS__MAILER__SMTP_PROTOCOL=smtp
          export BDS__MAILER__SMTP_ADDRESS=127.0.0.1:1025
          export BDS__MAILER__FROM=security@bdspro.test
          export BDS__MAILER__USERNAME=
          export BDS__MAILER__PASSWORD=
          make build
          bin/bdspro --config custom/conf/app.ini config check
          bin/bdspro --config custom/conf/app.ini migrate
          BDSPRO_GOOGLE_FLOW_TEST_DATABASE_URL=postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable go test ./models/db -run '^TestGoogleFlowLifecycle$' -count=1 -v
          test -z "$(gofmt -l models/db/password_reset_test.go)" || { gofmt -d models/db/password_reset_test.go; exit 1; }
          BDSPRO_PASSWORD_RESET_TEST_DATABASE_URL=postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable go test -race ./models/db -run '^TestPasswordResetLockExpiry$' -count=1 -v
          test -z "$(gofmt -l models/db/session_authority_test.go)" || { gofmt -d models/db/session_authority_test.go; exit 1; }
          BDSPRO_SESSION_AUTHORITY_TEST_DATABASE_URL=postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable go test -race ./models/db -run '^TestSessionAuthorityAfterLock$' -count=1 -v
          test -z "$(gofmt -l models/db/verification_authority_test.go)" || { gofmt -d models/db/verification_authority_test.go; exit 1; }
          BDSPRO_VERIFICATION_AUTHORITY_TEST_DATABASE_URL=postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable go test -race ./models/db -run '^TestVerificationAuthorityAfterLock$' -count=1 -v
          test -z "$(gofmt -l models/db/organization_authority_test.go services/org/team.go routers/api/v1/org/team.go)" || { gofmt -d models/db/organization_authority_test.go services/org/team.go routers/api/v1/org/team.go; exit 1; }
          BDSPRO_ORGANIZATION_AUTHORITY_TEST_DATABASE_URL=postgresql://root:secret@127.0.0.1:5432/bdspro?sslmode=disable go test -race ./models/db -run '^TestOrganizationAuthority$' -count=1 -v
          bin/bdspro --config custom/conf/app.ini web &
          pid=$!
          trap 'kill -TERM "$pid" 2>/dev/null || true; wait "$pid" || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            kill -0 "$pid"
            sleep 1
          done
          test "$ready" = 1
          make smoke-logging
          BDS_PROBE_PG_CONTAINER="${{ job.services.postgres.id }}" python3 scripts/probe-delivery.py
          kill -TERM "$pid"
          wait "$pid"
          trap - EXIT
      - name: Verify SQLC generated bindings
        run: |
          GOBIN="$RUNNER_TEMP/sqlc-bin" go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          PATH="$RUNNER_TEMP/sqlc-bin:$PATH" make sqlc-check
      # Deferred checks remain available on explicit manual dispatch.
      - name: Static analysis
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        run: go vet ./...
      - name: Unit and integration tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        run: go test ./... -count=1
      - name: Logging and IAM race tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        run: make verify-logging
      - name: Record formatter benchmark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        run: make bench-logging
