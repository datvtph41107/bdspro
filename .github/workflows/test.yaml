name: Run unit tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run migrations
        run: make migrateup

      - name: Run tests
        run: make test

      - name: Race detector
        run: go test -race ./...

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the isolated Compose stack
        run: docker compose up -d --build --wait

      - name: Verify HTTP and applied migrations
        run: |
          set -eu
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health -o /dev/null
          docker compose exec -T postgres psql -U root -d bdspro -At -F '|' -c 'SELECT version, dirty FROM schema_migrations;' | grep -qx '3|f'
          docker compose logs api | grep -q 'startup.ready'

      - name: Stop the stack (keep volumes)
        if: always()
        run: |
          docker compose logs --tail=100 api || true
          docker compose down || true
