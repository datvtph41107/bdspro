# Temporary formatter to be deleted after source is formatted.
name: Format Team outbox R22
on:
  push:
    branches: [feature/team-invite-delivery-r22]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply Go formatter to integration test
        run: |
          gofmt -w models/organization/team_outbox_integration_test.go
          git add -- models/organization/team_outbox_integration_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(invites): gofmt durable invitation tests'
            git push origin HEAD:feature/team-invite-delivery-r22
          fi
