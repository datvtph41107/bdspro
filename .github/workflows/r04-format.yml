name: Temporary Go formatter for R04
on:
  push:
    branches: [refactor/gitea-account-model-r04]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -w
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git add models/account
            git commit -m "style(go): format account model ownership changes"
            git push origin HEAD:refactor/gitea-account-model-r04
          fi
