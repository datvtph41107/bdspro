name: One-time R01 module tidy
on:
  push:
    branches: [refactor/gitea-ownership-r01]
permissions:
  contents: write
jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/gitea-ownership-r01
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tidy dependency graph
        run: |
          go mod tidy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): tidy R01 module dependencies'
            git push origin HEAD:refactor/gitea-ownership-r01
          fi
