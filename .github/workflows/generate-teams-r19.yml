# One-shot branch-only generation; removed after committing sqlc output.
name: Generate team models
on:
  push:
    branches: [feature/organization-team-r19]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SQLC v1.30.0
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate SQLC and format model source
        run: |
          make generated
          gofmt -w models/organization/team*.go models/organization/error.go
          git add -- models/db/sqlc models/db/sqlc_types.gen.go models/organization/team*.go models/organization/error.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(teams): generated SQLC package and formatted models'
            git push origin HEAD:feature/organization-team-r19
          fi
