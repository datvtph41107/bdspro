name: Temporary Go format for architecture refactor

on:
  push:
    branches: [refactor/canonical-architecture-20261026]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-architecture-20261026
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gofmt and tidy
        run: |
          git ls-files -z '*.go' | xargs -0 -r gofmt -w
          go mod tidy
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(go): gofmt all Go files and tidy dependencies'
            git push origin HEAD:refactor/canonical-architecture-20261026
          fi
