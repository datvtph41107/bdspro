name: R03 temporary formatter
on:
  push:
    branches: [refactor/gitea-gin-ownership-r03]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Go source
        run: |
          find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -w
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git add routers/api/v1 modules/structs services/convert
            git commit -m "style(go): apply gofmt to resource Gin handlers"
            git push origin HEAD:refactor/gitea-gin-ownership-r03
          fi
