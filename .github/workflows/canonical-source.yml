name: Verify canonical Go source

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/canonical-source.yml"
      - "db/query/**"
      - "db/migration/**"
      - "db/sqlc/store.go"
      - "api/organization.go"
      - "api/organization_test.go"
      - "gapi/server.go"
      - "gapi/server_test.go"
      - "main.go"
      - "util/**"
      - "api/server.go"
      - "worker/**"
      - "go.mod"
      - "Dockerfile"
      - "Makefile"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install go.uber.org/mock/mockgen@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate SQL and mocks
        run: |
          go mod tidy
          make sqlc
          make mock
          find . -type f -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -w
      - name: Verify generated files are committed
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard db/sqlc db/mock worker/mock)" ]; then
            echo "Generated files are not committed"
            exit 1
          fi
