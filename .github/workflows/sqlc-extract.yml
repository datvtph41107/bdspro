name: SQLC temporary source extraction

on:
  push:
    branches:
      - refactor/canonical-architecture-20261026

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install sqlc and mockgen
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install go.uber.org/mock/mockgen@v0.6.0
      - name: Print generated Go sources for connector commit
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          "$(go env GOPATH)/bin/mockgen" -package mockdb -destination db/mock/store.go github.com/datvtph41107/bdspro/db/sqlc Store
          for f in db/sqlc/google_identity.sql.go db/sqlc/phone_otp.sql.go db/sqlc/verify_email_extra.sql.go db/sqlc/querier.go db/mock/store.go; do
            printf '__SQLC_BEGIN__%s\n' "$f"
            cat "$f"
            printf '__SQLC_END__%s\n' "$f"
          done
