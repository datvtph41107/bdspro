name: Lecture 37 baseline

on:
  push:
    branches: [refactor/lecture-37-simplebank-baseline]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro_lecture37_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro_lecture37_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod tidy
      - name: Lint and unit tests
        run: |
          go vet ./...
          go test -v ./api ./token ./util
      - name: Run test migration
        env:
          PGPASSWORD: secret
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U root -d bdspro_lecture37_test -v ON_ERROR_STOP=1 -f db/migration/000001_party_account_session.up.sql
      - name: PostgreSQL integration tests
        env:
          DB_TEST_URL: postgres://root:secret@127.0.0.1:5432/bdspro_lecture37_test?sslmode=disable
        run: go test -v -count=1 ./db/sqlc
