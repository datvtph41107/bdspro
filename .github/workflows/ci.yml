name: Lecture 37 baseline

on:
  push:
    branches: [dev, refactor/lecture-37-simplebank-baseline]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bdspro_lecture37_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d bdspro_lecture37_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod tidy
      - name: Regenerate SQLC and Store mock
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install go.uber.org/mock/mockgen@v0.6.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          sqlc generate
          mockgen -package mockdb -destination db/mock/store.go github.com/datvtph41107/bdspro/db/sqlc Store
      - name: Lint and unit tests
        run: |
          go vet ./...
          go test -v ./api ./token ./util
      - name: Run test migration
        env:
          PGPASSWORD: secret
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U root -d bdspro_lecture37_test -v ON_ERROR_STOP=1 -f db/migration/000001_party_account_session.up.sql
      - name: PostgreSQL integration tests
        env:
          DB_TEST_URL: postgres://root:secret@127.0.0.1:5432/bdspro_lecture37_test?sslmode=disable
        run: go test -v -count=1 ./db/sqlc
      - name: Smoke test full HTTP auth flow against Postgres
        env:
          DB_SOURCE: postgres://root:secret@127.0.0.1:5432/bdspro_lecture37_test?sslmode=disable
          SERVER_ADDRESS: 127.0.0.1:18081
        run: |
          go build -o /tmp/bdspro-lecture37 .
          /tmp/bdspro-lecture37 > /tmp/bdspro-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/bdspro-server.log' EXIT
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          base = "http://127.0.0.1:18081"
          def request(method, path, body=None, access=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Content-Type":"application/json"}
              if access: headers["Authorization"] = "Bearer " + access
              req = urllib.request.Request(base+path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=5) as resp:
                  return resp.status, json.load(resp)
          for attempt in range(50):
              try:
                  status, _ = request("POST", "/users", {"email":"smoke@example.test","password":"strong-password-123"})
                  assert status == 201
                  break
              except urllib.error.URLError as err:
                  if isinstance(err, urllib.error.HTTPError): raise
                  time.sleep(0.2)
          else:
              raise SystemExit("Go HTTP server did not start")
          status, login = request("POST", "/users/login", {"email":"smoke@example.test","password":"strong-password-123"})
          assert status == 200 and login["session_id"] and login["access_token"] and login["refresh_token"]
          status, me = request("GET", "/users/me", access=login["access_token"])
          assert status == 200 and me["account_id"] == login["user"]["account_id"]
          status, renewed = request("POST", "/tokens/renew_access", {"refresh_token":login["refresh_token"]})
          assert status == 200 and renewed["access_token"]
          status, me2 = request("GET", "/users/me", access=renewed["access_token"])
          assert status == 200 and me2["account_id"] == me["account_id"]
          print("Lecture37 HTTP smoke PASS: register -> login -> me -> renew -> me")
          PY
      - name: Validate local reset script syntax
        run: bash -n scripts/reset-bdspro-lecture37.sh
      - name: Generated source stays in sync
        run: |
          gofmt -w api db token util main.go
          git diff --exit-code -- go.mod go.sum api db/sqlc db/mock token util main.go
          docker compose config --quiet
